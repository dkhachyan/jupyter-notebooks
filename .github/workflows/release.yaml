name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute the version from the tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image tag and the chart appVersion must be the same VERSION.
      - uses: docker/build-push-action@v6
        with:
          context: controller
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notebook-route-controller:${{ steps.tag.outputs.version }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Package and publish the Helm chart
        run: |
          VERSION=${{ steps.tag.outputs.version }}
          helm dependency build charts/kubeflow-notebooks-no-istio
          helm package charts/kubeflow-notebooks-no-istio --version $VERSION --app-version $VERSION
          helm push "kubeflow-notebooks-no-istio-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
