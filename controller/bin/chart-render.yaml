# Source: kubeflow-notebooks-no-istio/templates/jupyter-web-app.yaml
# Per-route authentication for the web app: ext_authz against oauth2-proxy
# (login redirect / Authorization header) followed by JWT validation, which
# replaces the client-sent userIdHeader with the value from the validated ID
# token. No authorization policy: the web app authorizes every API call itself
# (SubjectAccessReviews for the user in auth.userIdHeader).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: it-kubeflow-notebooks-no-istio-jupyter-web-app
  namespace: kubeflow
  labels:
    helm.sh/chart: kubeflow-notebooks-no-istio-0.1.0
    app.kubernetes.io/part-of: kubeflow-notebooks-no-istio
    app.kubernetes.io/instance: it
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jupyter-web-app
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: it-kubeflow-notebooks-no-istio-jupyter-web-app
  extAuth:
    {"headersToExtAuth":["cookie","x-forwarded-proto","x-forwarded-host","x-forwarded-for"],"http":{"backendRefs":[{"name":"it-kubeflow-notebooks-no-istio-oauth2-proxy","namespace":"kubeflow","port":4180}],"headersToBackend":["authorization"]}}
  jwt:
    providers:
      -
        {"audiences":["kubeflow-notebooks"],"claimToHeaders":[{"claim":"email","header":"kubeflow-userid"}],"issuer":"https://dex.example.com/dex","name":"kubeflow","remoteJWKS":{"uri":"https://dex.example.com/dex/keys"}}
