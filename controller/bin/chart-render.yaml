apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-kubeflow-notebooks-no-istio-notebook-controller
  namespace: kubeflow
  labels:
    helm.sh/chart: kubeflow-notebooks-no-istio-0.1.0
    app.kubernetes.io/part-of: kubeflow-notebooks-no-istio
    app.kubernetes.io/instance: it
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: notebook-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notebook-controller
      app.kubernetes.io/instance: it
  template:
    metadata:
      labels:
        helm.sh/chart: kubeflow-notebooks-no-istio-0.1.0
        app.kubernetes.io/part-of: kubeflow-notebooks-no-istio
        app.kubernetes.io/instance: it
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: notebook-controller
    spec:
      serviceAccountName: it-kubeflow-notebooks-no-istio-notebook-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "ghcr.io/kubeflow/notebooks/notebook-controller:v1.11.1"
          imagePullPolicy: IfNotPresent
          command: [/manager]
          args:
            - --metrics-addr=:8080
            - --probe-addr=:8081
          env:
            - name: USE_ISTIO
              value: "false"
            - name: CLUSTER_DOMAIN
              value: "cluster.local"
            - name: ENABLE_CULLING
              value: "false"
            - name: CULL_IDLE_TIME
              value: "1440"
            - name: IDLENESS_CHECK_PERIOD
              value: "1"
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
