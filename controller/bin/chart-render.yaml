            - "--jwt-provider={\"audiences\":[\"kubeflow-notebooks\"],\"claimToHeaders\":[{\"claim\":\"email\",\"header\":\"kubeflow-userid\"}],\"issuer\":\"https://dex.example.com/dex\",\"name\":\"kubeflow\",\"remoteJWKS\":{\"uri\":\"https://dex.example.com/dex/keys\"}}"
