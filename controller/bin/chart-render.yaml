# Source: kubeflow-notebooks-no-istio/templates/jupyter-web-app.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: it-kubeflow-notebooks-no-istio-jupyter-web-app
  namespace: kubeflow
  labels:
    helm.sh/chart: kubeflow-notebooks-no-istio-0.1.0
    app.kubernetes.io/part-of: kubeflow-notebooks-no-istio
    app.kubernetes.io/instance: it
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: jupyter-web-app
spec:
  parentRefs:
    - namespace: kubeflow
      group: gateway.networking.k8s.io
      kind: Gateway
      name: kubeflow-gateway
      sectionName: https
  hostnames:
    - "kubeflow.example.com"
  rules:
    # Namespace dropdown of the web app: served by the route controller, which
    # filters namespaces by the list-notebooks permission of the user. Must be
    # a rule of THIS route so that the SecurityPolicy above (ext_authz + jwt
    # setting the trusted auth.userIdHeader) applies to it. No URLRewrite: the
    # endpoint parses the raw path.
    - matches:
        - path:
            type: Exact
            value: /jupyter/api/namespaces
      backendRefs:
        - name: it-kubeflow-notebooks-no-istio-notebook-route-controller
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /jupyter
      # Same rewrite as the upstream Istio VirtualService of the web app.
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-forwarded-prefix
                value: "/jupyter"
      backendRefs:
        - name: it-kubeflow-notebooks-no-istio-jupyter-web-app
          port: 80
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /jupyter/
            statusCode: 302
