# Source: kubeflow-notebooks-no-istio/templates/route-controller.yaml
# Only the gateway proxies may reach the namespaces API; metrics and health
# probe ports stay reachable from everywhere so that scrapers and kubelet
# probes keep working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: it-kubeflow-notebooks-no-istio-notebook-route-controller
  namespace: kubeflow
  labels:
    helm.sh/chart: kubeflow-notebooks-no-istio-0.1.0
    app.kubernetes.io/part-of: kubeflow-notebooks-no-istio
    app.kubernetes.io/instance: it
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: notebook-route-controller
spec:
  podSelector:
    app.kubernetes.io/name: notebook-route-controller
    app.kubernetes.io/instance: it
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - port: 8082
          protocol: TCP
