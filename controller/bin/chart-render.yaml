kind: Deployment
metadata:
  name: it-kubeflow-notebooks-no-istio-oauth2-proxy
  namespace: kubeflow
  labels:
    helm.sh/chart: kubeflow-notebooks-no-istio-0.1.0
    app.kubernetes.io/part-of: kubeflow-notebooks-no-istio
    app.kubernetes.io/instance: it
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: it
  template:
    metadata:
      labels:
        helm.sh/chart: kubeflow-notebooks-no-istio-0.1.0
        app.kubernetes.io/part-of: kubeflow-notebooks-no-istio
        app.kubernetes.io/instance: it
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: "quay.io/oauth2-proxy/oauth2-proxy:v7.15.6"
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - "--oidc-issuer-url=https://dex.example.com/dex"
            - "--client-id=kubeflow-notebooks"
            - "--redirect-url=https://kubeflow.example.com/oauth2/callback"
            - "--scope=openid email profile groups"
            - "--user-id-claim=email"
            - "--oidc-groups-claim=groups"
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --upstream=static://200
            - --set-authorization-header=true
            - --skip-provider-button=true
            - "--email-domain=*"
            - --code-challenge-method=S256
            - "--cookie-name=_oauth2_proxy_kubeflow"
            - "--cookie-expire=24h"
            - --cookie-refresh=0
            - --cookie-secure=true
            - --cookie-samesite=lax
            - "--api-route=^/jupyter/api/"
            - "--api-route=^/notebook/[^/]+/[^/]+/api/"
            - --silence-ping-logging=true
          ports:
            - name: http
              containerPort: 4180
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubeflow-notebooks-oidc
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: it-kubeflow-notebooks-no-istio-oauth2-proxy
                  key: cookie-secret
          livenessProbe:
            httpGet:
              path: /ping
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
