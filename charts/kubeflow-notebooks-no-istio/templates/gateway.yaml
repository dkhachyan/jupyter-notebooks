{{- $gwNs := include "kni.gatewayNamespace" . }}
{{- $gw := .Values.gateway }}
{{- if $gw.createGatewayClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ $gw.className }}
  labels: {{- include "kni.labels" . | nindent 4 }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
{{- end }}
{{- if $gw.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.name }}
  namespace: {{ $gwNs }}
  labels: {{- include "kni.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $gw.className }}
  listeners:
    - name: {{ $gw.sectionName }}
      hostname: {{ $gw.hostname | quote }}
      port: {{ $gw.listener.port }}
      protocol: {{ $gw.listener.protocol }}
      {{- if eq $gw.listener.protocol "HTTPS" }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ $gw.listener.tlsSecretName }}
      {{- end }}
      allowedRoutes: {{- toYaml $gw.listener.allowedRoutes | nindent 8 }}
{{- end }}
