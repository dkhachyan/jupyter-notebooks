apiVersion: v2
name: kubeflow-notebooks-no-istio
description: >-
  Kubeflow Notebooks (upstream notebook-controller and Jupyter web app) without Istio,
  exposed through Gateway API HTTPRoutes on Envoy Gateway with OIDC login and
  per-Notebook authorization derived from Kubernetes RBAC.
type: application
version: 0.1.0
# Version of the notebook-route-controller image.
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
keywords:
  - kubeflow
  - notebooks
  - jupyter
  - gateway-api
  - envoy-gateway
annotations:
  # Upstream components deployed unmodified by this chart.
  kubeflow.org/notebooks-version: v1.11.1
  gateway.envoyproxy.io/version: v1.9.3
dependencies:
  # Optional: install Envoy Gateway together with this chart (development and
  # single-tenant clusters). Production clusters normally run one shared
  # Envoy Gateway installed separately.
  - name: gateway-helm
    alias: envoy-gateway
    version: v1.9.3
    repository: oci://docker.io/envoyproxy
    condition: envoy-gateway.enabled
